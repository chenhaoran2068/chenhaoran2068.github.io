<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Frameworks、Systems 与 Skills 的公开类别关系</title>
  <desc id="desc">Frameworks 为 Systems 提供工作区边界。Systems 只能在特定模式或阶段、经明确请求和输入确认后受控引用独立 Skills。三者为并列类别，不构成自动启动或从属关系。</desc>
  <defs>
    <pattern id="grid" width="120" height="84" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 84" fill="none" stroke="#e1e7ea" stroke-width="1"/>
    </pattern>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#245f96"/>
    </marker>
    <marker id="amber-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#a35d10"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <rect x="22" y="22" width="1156" height="516" fill="url(#grid)" stroke="#edf1f3"/>
  <text x="78" y="84" fill="#53626d" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="700" letter-spacing="2">PUBLIC COMPONENT CATEGORIES</text>

  <rect x="82" y="154" width="278" height="214" rx="3" fill="#e9f2fa" stroke="#245f96" stroke-width="2"/>
  <text x="108" y="190" fill="#245f96" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">01 / FRAMEWORKS</text>
  <text x="108" y="236" fill="#17212b" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="27" font-weight="750">Frameworks</text>
  <text x="108" y="278" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">工作区结构、System 绑定</text>
  <text x="108" y="306" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">公共 / 私有边界</text>
  <text x="108" y="342" fill="#245f96" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="700">类别，不规定研究内部规则</text>

  <rect x="462" y="154" width="318" height="214" rx="3" fill="#e8f4f0" stroke="#08766c" stroke-width="2"/>
  <text x="490" y="190" fill="#08766c" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">02 / SYSTEMS</text>
  <text x="490" y="236" fill="#17212b" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="27" font-weight="750">Systems</text>
  <text x="490" y="278" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">一类任务的生命周期、路由</text>
  <text x="490" y="306" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">记录、规则与治理边界</text>
  <text x="490" y="342" fill="#08766c" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="700">可在特定路线中引用 Skill</text>

  <rect x="882" y="154" width="236" height="214" rx="3" fill="#fbefdf" stroke="#a35d10" stroke-width="2"/>
  <text x="908" y="190" fill="#a35d10" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">03 / SKILLS</text>
  <text x="908" y="236" fill="#17212b" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="27" font-weight="750">Skills</text>
  <text x="908" y="278" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">独立的专门能力</text>
  <text x="908" y="306" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">有各自的输入与边界</text>
  <text x="908" y="342" fill="#a35d10" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="700">不属于任何 System 的下级</text>

  <line x1="362" y1="262" x2="450" y2="262" stroke="#245f96" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="406" y="238" text-anchor="middle" fill="#475967" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14" font-weight="700">工作区边界与绑定</text>

  <line x1="782" y1="262" x2="870" y2="262" stroke="#a35d10" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#amber-arrow)"/>
  <text x="826" y="224" text-anchor="middle" fill="#7b551e" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="13" font-weight="700">特定模式 / 阶段</text>
  <text x="826" y="242" text-anchor="middle" fill="#7b551e" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="13" font-weight="700">明确请求 + 输入确认</text>

  <rect x="82" y="418" width="1036" height="62" rx="2" fill="#f7f9fa" stroke="#d9e1e5"/>
  <text x="108" y="455" fill="#17212b" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="750">不表示：</text>
  <text x="190" y="455" fill="#53626d" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="16">自动调用 · 从属关系 · 权限继承 · 创建 Study · 访问数据 · 认定伦理或注册 · 决定结论 · 提交平台</text>
  <text x="82" y="512" fill="#687781" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">具体 Framework、System 与 Skill 仅在各自分类目录中列出；本图只说明类别层面的关系。</text>
</svg>
