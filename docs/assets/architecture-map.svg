<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Governed research collaboration component map</title>
  <desc id="desc">Framework connects to the Research Workflow. The ethics module is reached only through explicit, confirmed conditions.</desc>
  <rect width="960" height="300" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="90" width="245" height="104" rx="6" fill="#e0f2fe" stroke="#075985" stroke-width="2"/>
    <text x="172" y="126" font-size="20" fill="#172033">Workspace Framework</text>
    <text x="172" y="155" font-size="14" fill="#506076">ownership and boundaries</text>
    <rect x="357" y="90" width="245" height="104" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="479" y="126" font-size="20" fill="#172033">Research Workflow</text>
    <text x="479" y="155" font-size="14" fill="#506076">research route control</text>
    <rect x="664" y="90" width="245" height="104" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="786" y="126" font-size="20" fill="#172033">research-ethics</text>
    <text x="786" y="155" font-size="14" fill="#506076">explicit preparation only</text>
    <path d="M295 142 H357" fill="none" stroke="#075985" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M602 142 H664" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="633" y="70" font-size="13" fill="#7c2d12">explicit request + confirmed inputs</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
