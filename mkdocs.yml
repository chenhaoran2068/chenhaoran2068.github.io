site_name: Research Collaboration
site_description: Public navigation for governed research collaboration components
site_url: https://chenhaoran2068.github.io/
repo_url: https://github.com/chenhaoran2068/chenhaoran2068.github.io
repo_name: chenhaoran2068/chenhaoran2068.github.io
edit_uri: null
theme:
  name: mkdocs
  language: zh
  custom_dir: docs/overrides
plugins:
  - search:
      lang:
        - zh
        - en
        - ja
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Research Collaboration
          site_description: Public navigation for research collaboration components
          theme:
            language: en
          nav_translations:
            首页: Home
            组件: Components
            Framework 总览: Frameworks
            System 总览: Systems
            Skills 总览: Skills
            开始使用: Get started
            外部集成: Integrations
            版本与治理: Releases & governance
            发布与兼容: Releases & compatibility
            治理边界: Governance boundaries
            路线图: Roadmap
        - locale: ja
          name: 日本語
          build: true
          site_name: Research Collaboration
          site_description: 研究協働コンポーネントの公開案内
          theme:
            language: ja
          nav_translations:
            首页: ホーム
            组件: コンポーネント
            Framework 总览: Framework 一覧
            System 总览: System 一覧
            Skills 总览: Skills 一覧
            开始使用: はじめる
            外部集成: 外部連携
            版本与治理: リリースとガバナンス
            发布与兼容: リリースと互換性
            治理边界: ガバナンスの境界
            路线图: ロードマップ
extra_css:
  - stylesheets/portal.css
nav:
  - 首页: index.md
  - 组件:
      - Framework 总览: frameworks/index.md
      - System 总览: systems/index.md
      - Skills 总览: skills/index.md
  - 开始使用: user-paths/index.md
  - 外部集成: integrations.md
  - 版本与治理:
      - 发布与兼容: releases.md
      - 治理边界: governance.md
      - 路线图: roadmap.md
